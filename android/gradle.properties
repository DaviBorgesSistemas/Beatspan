org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
dev.steenbakker.mobile_scanner.useUnbundled=true

# Kotlin incremental compilation quebra no Windows quando o projeto e o
# Pub Cache (%LOCALAPPDATA%) estão em drives diferentes: o
# RelocatableFileToPathConverter tenta relativizar caminhos entre roots
# diferentes (ex.: C:\ vs D:\) e derruba o daemon Kotlin.
kotlin.incremental=false